<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>json-camera chat</title>
<meta name="theme-color" content="#2a8a56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="jc chat">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>💬</text></svg>">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#eceff3; --bar:#ffffff; --line:#dfe3e8;
    --ink:#2f3640; --soft:#5a6472; --faint:#8b95a3;
    --me:#35a86b; --them:#ffffff;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:Menlo,Monaco,Consolas,monospace;
    --serif:Georgia,serif;
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; overscroll-behavior-y:contain;
  }

  header > *{max-width:none}
  header{
    background:linear-gradient(to bottom,#fff,#f7f8fa);
    border-bottom:1px solid var(--line); box-shadow:0 1px 2px rgba(45,55,70,.05);
    padding:calc(env(safe-area-inset-top) + 11px) 16px 11px;
    display:flex; align-items:center; gap:11px; flex:none;
  }
  header .dot{width:9px;height:9px;border-radius:50%;background:#c3ccd6;flex:none;transition:background .2s}
  header .dot.on{background:var(--me);box-shadow:0 0 0 3px rgba(53,168,107,.18)}
  header h1{margin:0;font:400 19px/1.2 var(--serif)}
  header h1 b{color:var(--me);font-weight:700}
  header .state{margin-left:auto;font-size:12px;color:var(--faint)}

  /* The bubbles are sized as a share of the column, so without a cap they run
     the full width of a desktop window and stop reading as a conversation. */
  #log{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
  #log > *{max-width:620px;margin-left:auto;margin-right:auto}
  .msg{max-width:min(82%,520px)}
  .msg{max-width:82%;margin-bottom:11px;padding:10px 14px;border-radius:16px;
       font-size:15.5px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap;
       box-shadow:0 1px 2px rgba(45,55,70,.10)}
  #log > .msg.me{margin-right:0}
  .msg.me{margin-left:auto;background:var(--me);color:#fff;border-bottom-right-radius:5px}
  #log > .msg.them{margin-left:0}
  .msg.them{margin-right:auto;background:var(--them);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg code,.msg pre{font-family:var(--mono);font-size:13px}
  .msg pre{margin:7px 0 0;padding:9px 11px;background:rgba(0,0,0,.055);border-radius:8px;overflow-x:auto}
  .msg.me pre{background:rgba(255,255,255,.18)}
  .when{font-size:11px;color:var(--faint);margin:-6px 4px 12px;}
  .when.me{text-align:right}
  .day{text-align:center;font-size:11.5px;color:var(--faint);margin:12px 0 14px;
       text-transform:uppercase;letter-spacing:.05em}
  .empty{text-align:center;color:var(--faint);font:italic 15px/1.6 var(--serif);padding:44px 24px}

  footer{
    background:linear-gradient(to bottom,#fff,#f7f8fa); border-top:1px solid var(--line);
    padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
    display:flex; gap:9px; align-items:flex-end; flex:none;
  }
  textarea{
    flex:1; resize:none; max-height:132px; padding:11px 14px; font:15.5px/1.45 var(--sans);
    border:1px solid #c9d0d8; border-radius:20px; background:#fff; color:var(--ink);
  }
  textarea:focus{outline:none;border-color:var(--me);box-shadow:0 0 0 3px rgba(53,168,107,.14)}
  button.send{
    flex:none; width:44px; height:44px; border-radius:50%; border:1px solid #2a8a56;
    background:linear-gradient(to bottom,#43bd7c,var(--me)); color:#fff; font-size:19px;
    cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(45,55,70,.16);
  }
  button.send:disabled{opacity:.45}

  /* Training panel. A strip under the header on a phone, opened with a tap; a
     sidebar beside the conversation once the window is wide enough for one. */
  #train{background:var(--bar);border-bottom:1px solid var(--line);flex:none;
         font-size:13px;color:var(--soft)}
  #train[hidden]{display:none}
  #train .strip{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
                user-select:none;-webkit-tap-highlight-color:transparent}
  #train .strip:focus-visible{outline:2px solid var(--me);outline-offset:-2px}
  #train .bar{flex:1;height:8px;border-radius:4px;background:#e4e8ed;overflow:hidden;min-width:60px}
  #train .bar i{display:block;height:100%;width:0;background:var(--me);border-radius:4px;
                transition:width .5s ease}
  #train .pct{font:600 13px var(--mono);color:var(--ink);min-width:3.2em;text-align:right}
  #train .brief{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
  #train .brief b{color:var(--ink);font-weight:600}
  #train .caret{flex:none;transition:transform .2s;color:var(--faint)}
  #train.open .caret{transform:rotate(180deg)}
  #train .body{display:none;padding:2px 14px 14px;border-top:1px dashed var(--line)}
  #train.open .body{display:block}
  #train .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  #train .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  #train .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  #train .stat .v{font:600 17px/1.25 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;
                  letter-spacing:-.01em}
  #train .stat .v small{font-size:11px;font-weight:400;color:var(--soft)}
  #train .stat .d{font:11px var(--mono);color:var(--faint)}
  #train .stat .d.up{color:var(--me)}
  #train .stat .d.down{color:#d9534f}
  #train svg{display:block;width:100%;height:auto;overflow:visible}
  #train .legend{display:flex;gap:14px;font-size:11px;color:var(--faint);margin-top:4px}
  #train .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  #train .foot{font:11.5px/1.5 var(--mono);color:var(--faint);margin-top:10px;white-space:pre-wrap}
  #train .foot b{color:var(--soft);font-weight:600}
  #train.stale .bar i{background:#c3ccd6}
  #train.stale .pct{color:var(--faint)}
  #train .step{font:12px var(--mono);color:var(--soft);margin-top:8px}
  #train .step i{display:block;height:4px;border-radius:2px;background:#e4e8ed;margin-top:5px;overflow:hidden}
  #train .step i b{display:block;height:100%;width:0;background:#8fd4b0;transition:width .35s}

  @media (min-width: 900px) {
    body{display:grid;grid-template-columns:1fr 340px;
         grid-template-rows:auto 1fr auto;
         grid-template-areas:"header header" "log train" "footer train"}
    header{grid-area:header} #log{grid-area:log} footer{grid-area:footer}
    body:has(#train[hidden]){grid-template-columns:1fr;grid-template-areas:"header" "log" "footer"}
    #train{grid-area:train;border-bottom:0;border-left:1px solid var(--line);overflow-y:auto}
    #train .strip{cursor:default;padding-top:14px}
    #train .caret{display:none}
    #train .body{display:block;border-top:0;padding-top:0}
    #train .stats{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion: reduce){ #train .bar i,#train .step i b{transition:none} }

  #gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;
        align-items:center;justify-content:center;padding:26px}
  #gate .box{background:#fff;border:1px solid var(--line);border-radius:10px;
             box-shadow:0 4px 16px rgba(45,55,70,.14);padding:28px 24px;max-width:340px;width:100%}
  #gate h2{margin:0 0 6px;font:400 22px var(--serif)}
  #gate p{margin:0 0 18px;color:var(--soft);font-size:14.5px}
  #gate input{width:100%;padding:12px 14px;border:1px solid #c9d0d8;border-radius:7px;
              font:15px var(--sans);margin-bottom:12px}
  #gate button{width:100%;padding:13px;border-radius:7px;border:1px solid #2a8a56;
               background:linear-gradient(to bottom,#43bd7c,var(--me));color:#fff;
               font:600 15px var(--sans);cursor:pointer}
  #gate .err{color:#d9534f;font-size:13.5px;margin-top:10px;display:none}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>json<b style="color:#35a86b">camera</b> chat</h2>
    <p>Enter the key to open the line.</p>
    <input id="key" type="password" placeholder="key" autocomplete="current-password" enterkeyhint="go">
    <button id="unlock">Open</button>
    <div class="err" id="gate-err">That key was not accepted.</div>
  </div>
</div>

<header>
  <span class="dot" id="dot"></span>
  <h1>json<b>camera</b></h1>
  <span class="state" id="state">connecting</span>
</header>

<aside id="train" hidden aria-label="training progress">
  <div class="strip" id="train-strip" role="button" tabindex="0" aria-expanded="false" aria-controls="train-body">
    <span class="pct" id="train-pct">0%</span>
    <span class="bar"><i id="train-bar"></i></span>
    <span class="brief" id="train-brief">waiting for the run</span>
    <span class="caret" aria-hidden="true">&#9662;</span>
  </div>
  <div class="body" id="train-body">
    <div class="stats" id="train-stats"></div>
    <figure style="margin:0" id="train-chart"></figure>
    <div class="legend"><span><i style="background:#35a86b"></i>val PSNR</span><span><i style="background:#3b7dd8"></i>train PSNR</span><span><i style="background:#e3a21a"></i>val bpp</span></div>
    <div class="step" id="train-step"></div>
    <div class="foot" id="train-foot"></div>
  </div>
</aside>

<div id="log"><div class="empty">No messages yet. Say something and it reaches the Mac.</div></div>

<footer>
  <textarea id="box" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
  <button class="send" id="send" disabled>&#10148;</button>
</footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), box = $('box'), send = $('send'), dot = $('dot'), state = $('state');
  let key = localStorage.getItem('jc_key') || '';
  let after = 0, seen = new Set(), lastDay = '';

  /* ---- gate ---- */
  async function tryKey(k) {
    const r = await fetch(`/api/chat?after=0&key=${encodeURIComponent(k)}`);
    return r.ok;
  }
  async function unlock() {
    const k = $('key').value.trim();
    if (!k) return;
    if (await tryKey(k)) {
      key = k; localStorage.setItem('jc_key', k);
      $('gate').style.display = 'none';
      start();
    } else {
      $('gate-err').style.display = 'block';
    }
  }
  $('unlock').addEventListener('click', unlock);
  $('key').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

  /* ---- rendering ---- */
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function format(t) {
    // Fenced blocks and inline code, because most of what gets sent here is code.
    return esc(t)
      .replace(/```([\s\S]*?)```/g, (_, c) => `<pre>${c.trim()}</pre>`)
      .replace(/`([^`\n]+)`/g, '<code>$1</code>');
  }
  const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const dayOf = ts => new Date(ts * 1000).toLocaleDateString([], {weekday:'long', day:'numeric', month:'long'});

  function add(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const first = log.querySelector('.empty');
    if (first) first.remove();

    const day = dayOf(m.at);
    if (day !== lastDay) {
      lastDay = day;
      const d = document.createElement('div');
      d.className = 'day'; d.textContent = day; log.append(d);
    }
    const mine = m.who !== 'claude';
    const el = document.createElement('div');
    el.className = 'msg ' + (mine ? 'me' : 'them');
    el.innerHTML = format(m.text);
    const w = document.createElement('div');
    w.className = 'when ' + (mine ? 'me' : '');
    w.textContent = (mine ? '' : 'claude · ') + clock(m.at);
    log.append(el, w);
  }
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  function scroll(force) { if (force || atBottom()) log.scrollTop = log.scrollHeight; }

  /* ---- long poll ---- */
  async function poll() {
    while (true) {
      try {
        const r = await fetch(`/api/chat?after=${after}&key=${encodeURIComponent(key)}&wait=45`);
        if (r.status === 401) { localStorage.removeItem('jc_key'); location.reload(); return; }
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        dot.classList.add('on'); state.textContent = 'connected';
        const stick = atBottom();
        for (const m of d.messages) { add(m); after = Math.max(after, m.id); }
        if (d.messages.length) scroll(stick);
      } catch (_) {
        dot.classList.remove('on'); state.textContent = 'reconnecting';
        await new Promise(r => setTimeout(r, 3000));
      }
    }
  }

  /* ---- sending ---- */
  async function submit() {
    const text = box.value.trim();
    if (!text) return;
    box.value = ''; grow(); send.disabled = true;
    try {
      const body = new FormData();
      body.append('text', text); body.append('who', 'mubaraq'); body.append('key', key);
      const r = await fetch('/api/chat', { method: 'POST', body });
      if (r.ok) { const m = await r.json(); add(m); after = Math.max(after, m.id); scroll(true); }
      else { box.value = text; }
    } catch (_) { box.value = text; }
    grow();
  }
  function grow() {
    box.style.height = 'auto';
    box.style.height = Math.min(box.scrollHeight, 132) + 'px';
    send.disabled = !box.value.trim();
  }
  box.addEventListener('input', grow);
  box.addEventListener('keydown', e => {
    // Enter sends on a desktop keyboard; on a phone the key says "send" anyway.
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 700px)').matches) {
      e.preventDefault(); submit();
    }
  });
  send.addEventListener('click', submit);

  /* ---- training panel ---- */
  const T = {
    el: $('train'), strip: $('train-strip'), pct: $('train-pct'), bar: $('train-bar'),
    brief: $('train-brief'), stats: $('train-stats'), chart: $('train-chart'),
    step: $('train-step'), foot: $('train-foot'), open: localStorage.getItem('jc_train_open') === '1',
  };
  function toggleTrain() {
    T.open = !T.open;
    T.el.classList.toggle('open', T.open);
    T.strip.setAttribute('aria-expanded', String(T.open));
    try { localStorage.setItem('jc_train_open', T.open ? '1' : '0'); } catch (_) {}
  }
  T.strip.addEventListener('click', toggleTrain);
  T.strip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTrain(); } });
  T.el.classList.toggle('open', T.open);
  T.strip.setAttribute('aria-expanded', String(T.open));

  const fmt = (v, d) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d);
  const hhmm = iso => new Date(iso).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const hm = sec => { sec = Math.max(0, sec); const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60); return h ? `${h}h ${m}m` : `${m}m`; };

  function stat(k, v, unit, delta, better) {
    let d = '';
    if (delta != null && !isNaN(delta)) {
      const good = better === 'up' ? delta > 0 : delta < 0;
      d = `<div class="d ${delta === 0 ? '' : (good ? 'up' : 'down')}">${delta > 0 ? '+' : ''}${fmt(delta, 2)} vs last epoch</div>`;
    }
    return `<div class="stat"><div class="k">${k}</div><div class="v">${v}${unit ? ` <small>${unit}</small>` : ''}</div>${d}</div>`;
  }

  function chart(rows) {
    const withVal = rows.filter(r => r.val_psnr != null);
    if (rows.length < 1) { T.chart.innerHTML = ''; return; }
    const W = 320, H = 120, L = 30, R = 30, Tp = 8, B = 18;
    const xs = rows.map(r => r.epoch);
    const xmin = 1, xmax = Math.max(2, xs[xs.length - 1]);
    const ps = rows.flatMap(r => [r.val_psnr, r.train_psnr]).filter(v => v != null);
    let pmin = Math.floor(Math.min(...ps) - 0.5), pmax = Math.ceil(Math.max(...ps) + 0.5);
    if (pmax - pmin < 2) pmax = pmin + 2;
    const bs = rows.map(r => r.val_bpp).filter(v => v != null);
    let bmin = bs.length ? Math.floor(Math.min(...bs) * 10) / 10 - 0.1 : 0, bmax = bs.length ? Math.ceil(Math.max(...bs) * 10) / 10 + 0.1 : 1;
    if (bmax - bmin < 0.2) bmax = bmin + 0.2;
    const X = e => L + (e - xmin) / (xmax - xmin) * (W - L - R);
    const Y = p => Tp + (1 - (p - pmin) / (pmax - pmin)) * (H - Tp - B);
    const Yb = b => Tp + (1 - (b - bmin) / (bmax - bmin)) * (H - Tp - B);
    const line = (key, y, color, dash) => {
      const pts = rows.filter(r => r[key] != null).map(r => `${X(r.epoch).toFixed(1)},${y(r[key]).toFixed(1)}`);
      if (!pts.length) return '';
      const dots = rows.filter(r => r[key] != null).map(r => `<circle cx="${X(r.epoch).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="2.2" fill="${color}"/>`).join('');
      return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.8" ${dash ? 'stroke-dasharray="3 3"' : ''} stroke-linejoin="round"/>${dots}`;
    };
    const grid = [];
    for (let i = 0; i <= 3; i++) {
      const p = pmin + (pmax - pmin) * i / 3, b = bmin + (bmax - bmin) * i / 3;
      grid.push(`<line x1="${L}" x2="${W - R}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}" stroke="#e4e8ed"/>`,
                `<text x="${L - 4}" y="${(Y(p) + 3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#8b95a3">${p.toFixed(1)}</text>`,
                `<text x="${W - R + 4}" y="${(Yb(b) + 3.5).toFixed(1)}" font-size="9" fill="#c28a0c">${b.toFixed(2)}</text>`);
    }
    const ticks = [];
    const every = xmax > 12 ? Math.ceil(xmax / 6) : 1;
    for (let e = xmin; e <= xmax; e += every) ticks.push(`<text x="${X(e).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#8b95a3">${e}</text>`);
    T.chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PSNR and bits per pixel by epoch">${grid.join('')}${ticks.join('')}` +
      line('train_psnr', Y, '#3b7dd8', true) + line('val_bpp', Yb, '#e3a21a', false) + line('val_psnr', Y, '#35a86b', false) + `</svg>`;
  }

  function renderTrain(status, now) {
    if (!status) { T.el.hidden = true; return; }
    T.el.hidden = false;
    const rows = status.epochs || [], cfg = status.config || {}, cur = status.current, eta = status.eta;
    const last = rows[rows.length - 1], prev = rows[rows.length - 2];
    const total = Number(cfg.epochs) || 0;
    const ageSec = status.received ? Math.max(0, now - status.received) : 0;
    const stale = ageSec > 240;
    T.el.classList.toggle('stale', stale);

    let frac = eta ? eta.fraction_complete : (total ? (rows.length + (cur && cur.iterations ? cur.iteration / cur.iterations : 0)) / total : 0);
    // The deadline, not the epoch count, is what ends this run: show the
    // nearer of the two so the bar does not promise an hour that is not coming.
    let finish = eta && eta.finish ? new Date(eta.finish) : null;
    let deadline = cfg.deadline && cfg.deadline !== 'None' ? new Date(cfg.deadline) : null;
    if (deadline && (!finish || deadline < finish)) {
      finish = deadline;
      const startAt = status.run_started ? new Date(status.run_started) : null;
      if (startAt) frac = Math.max(frac, Math.min(1, (Date.now() - startAt) / (deadline - startAt)));
    }
    frac = Math.min(1, Math.max(0, frac || 0));
    T.pct.textContent = Math.round(frac * 100) + '%';
    T.bar.style.width = (frac * 100).toFixed(1) + '%';

    let brief;
    if (!status.running && !rows.length) brief = status.message ? 'no run yet' : 'starting up';
    else if (!status.running && rows.length) brief = `finished · best <b>${fmt(rows.filter(r => r.best).slice(-1)[0]?.val_psnr, 2)} dB</b>`;
    else brief = `e<b>${cur ? cur.epoch : rows.length}</b>${total ? '/' + total : ''}` +
                 (last && last.val_psnr != null ? ` · <b>${fmt(last.val_psnr, 2)} dB</b> · ${fmt(last.val_bpp, 2)} bpp` : '') +
                 (finish ? ` · ~${hhmm(finish)}` : '');
    if (stale) brief += ` · <b>last word ${hm(ageSec)} ago</b>`;
    T.brief.innerHTML = brief;

    const dv = (k) => (last && prev && last[k] != null && prev[k] != null) ? last[k] - prev[k] : null;
    T.stats.innerHTML =
      stat('val PSNR', fmt(last?.val_psnr, 2), 'dB', dv('val_psnr'), 'up') +
      stat('val rate', fmt(last?.val_bpp, 3), 'bpp', dv('val_bpp'), 'down') +
      stat('val loss', fmt(last?.val_loss, 3), '', dv('val_loss'), 'down') +
      stat('epochs', `${rows.length}${total ? ' <small>/ ' + total + '</small>' : ''}`, '', null) +
      stat('finishes', finish ? hhmm(finish) : '—', '', null) +
      stat('per epoch', eta && eta.seconds_per_epoch ? hm(eta.seconds_per_epoch) : '—', '', null);
    chart(rows);

    if (cur && status.running) {
      const f = cur.iterations ? cur.iteration / cur.iterations : 0;
      T.step.innerHTML = `epoch ${cur.epoch} · step ${cur.iteration}/${cur.iterations} · ${fmt(cur.psnr, 2)} dB · ${fmt(cur.bpp, 3)} bpp (train, noise proxy)<i><b style="width:${(f * 100).toFixed(1)}%"></b></i>`;
    } else T.step.innerHTML = '';

    const bits = [];
    if (cfg.lmbda) bits.push(`<b>lambda</b> ${cfg.lmbda}`);
    if (cfg.hidden) bits.push(`<b>net</b> ${cfg.hidden}/${cfg.latent}`);
    if (cfg.patch) bits.push(`<b>crop</b> ${cfg.patch}px`);
    if (cfg.deadline && cfg.deadline !== 'None') bits.push(`<b>deadline</b> ${cfg.deadline.replace('T', ' ')}`);
    if (status.generated) bits.push(`<b>as of</b> ${hhmm(status.generated)}`);
    T.foot.innerHTML = bits.join('  ·  ') + (cfg._inferred ? `
config ${cfg._inferred}` : '');
  }

  async function pollTrain() {
    while (true) {
      try {
        const r = await fetch(`/api/training?key=${encodeURIComponent(key)}`, { cache: 'no-store' });
        if (r.ok) { const d = await r.json(); renderTrain(d.status, d.now); }
      } catch (_) {}
      await new Promise(r => setTimeout(r, 30000));
    }
  }

  function start() { scroll(true); poll(); pollTrain(); }

  if (key) {
    tryKey(key).then(ok => {
      if (ok) { $('gate').style.display = 'none'; start(); }
      else { localStorage.removeItem('jc_key'); }
    });
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(() => {});
})();
</script>
</body>
</html>
